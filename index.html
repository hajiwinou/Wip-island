<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d8efea"><title>WIP Island · a cozy little world</title>
<style>
:root{--ink:#405b55;--muted:#71877e;--paper:#fffdf5;--line:#dce8dc;--mint:#dff0e7;--sea:#9fd5d4;--sand:#f1dcae;--coral:#d99b91;--shadow:0 8px 24px #557b6b18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0%,#f7f1dd 0,transparent 38%),linear-gradient(180deg,#e7f4ed,#f7f4e9 68%,#f4ead8);color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;min-height:100vh}button,select{font:inherit}button{cursor:pointer}.app{max-width:1080px;margin:auto;padding:18px 16px calc(30px + env(safe-area-inset-bottom))}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:2px 2px 14px}.brand{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#78968a;font-weight:900}.save-note{font-size:11px;color:#7d9388}.hero{position:relative;overflow:hidden;min-height:210px;border:1px solid #c9e1d8;border-radius:26px;padding:24px;background:linear-gradient(135deg,#d9f0e9,#c2e4df 60%,#b8d9d6);box-shadow:var(--shadow)}.hero:before{content:"";position:absolute;left:-8%;right:-8%;height:110px;bottom:-66px;border-radius:50% 50% 0 0;background:#f0d9aa;box-shadow:0 -8px 0 #ffffff55}.sun{position:absolute;right:12%;top:25px;width:48px;height:48px;border-radius:50%;background:#fff0bc;box-shadow:0 0 0 12px #fff0bc35}.cloud{position:absolute;right:29%;top:55px;width:62px;height:17px;border-radius:20px;background:#ffffff85}.cloud:before,.cloud:after{content:"";position:absolute;bottom:0;background:inherit;border-radius:50%}.cloud:before{width:25px;height:25px;left:8px}.cloud:after{width:20px;height:20px;right:8px}.hero-copy{position:relative;z-index:2;max-width:520px}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:900;color:#6e9184}.hero h1{font-size:clamp(32px,6vw,52px);line-height:1;margin:8px 0;color:#3e6258}.hero p{font-size:14px;max-width:380px;color:#5d7b70;margin:0}.stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:17px}.pill{background:#ffffffbd;border:1px solid #a7c9ba65;border-radius:99px;padding:7px 11px;font-size:11px;font-weight:800;color:#53776a}.hero-island{position:absolute;right:4%;bottom:4px;width:40%;height:145px}.hero-sand{position:absolute;bottom:0;left:4%;width:94%;height:72px;border-radius:55% 45% 35% 35%;background:#e9c98f;box-shadow:inset 0 -8px #b8895420}.hero-tree{position:absolute;bottom:55px;right:25%;width:9px;height:77px;border-radius:8px;background:#a77b58;transform:rotate(8deg)}.hero-tree:before{content:"";position:absolute;left:-34px;top:-8px;width:78px;height:40px;background:#78a989;clip-path:polygon(50% 55%,0 0,40% 28%,18% 0,52% 35%,82% 0,65% 35%,100% 18%,62% 58%)}.hero-house{position:absolute;bottom:48px;left:16%;width:58px;height:43px;background:#fff0d6;border:3px solid #c58f72;border-radius:5px}.hero-house:before{content:"";position:absolute;left:-8px;top:-24px;width:68px;height:30px;background:#cf8f83;clip-path:polygon(50% 0,100% 100%,0 100%)}.hero-house:after{content:"";position:absolute;left:21px;bottom:0;width:14px;height:23px;background:#a97962;border-radius:7px 7px 0 0}.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0 3px;scrollbar-width:none}.tabs button{flex:1;min-width:105px;border:1px solid #d8e5d9;background:#ffffff9c;color:#688176;border-radius:14px;padding:12px 10px;font-size:12px;font-weight:850}.tabs button.active{background:#557d6d;color:white;border-color:#557d6d;box-shadow:0 4px 0 #3e6657}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.8fr);gap:14px;margin-top:13px}.stack{display:grid;gap:14px}.card{background:#fffdf2d9;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:var(--shadow);min-width:0}.card h2,.card h3{margin:0;font-size:16px}.muted{font-size:12px;color:var(--muted);line-height:1.5}.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.map{height:340px;position:relative;overflow:hidden;border-radius:17px;margin-top:12px;background:radial-gradient(ellipse at 15% 25%,#ffffff55 0 3px,transparent 4px),radial-gradient(ellipse at 80% 72%,#ffffff55 0 3px,transparent 4px),linear-gradient(135deg,#a9deda,#72b8ba);background-size:38px 38px,55px 55px,auto;border:2px solid #a4d0c7}.map:before{content:"";position:absolute;width:63%;height:60%;left:19%;top:19%;border-radius:47% 53% 42% 58%;background:#f1d9a7;border:8px solid #d9bd8a;box-shadow:inset 0 -10px #ad875322;transform:rotate(-8deg)}.map:after{content:"";position:absolute;width:24%;height:23%;left:4%;bottom:5%;border-radius:48%;background:#ead7a9;border:6px solid #d6bd8f}.map-label{position:absolute;z-index:4;left:12px;top:10px;color:#fff;font-size:10px;font-weight:900;letter-spacing:.13em;text-shadow:0 1px 3px #477f7c}.zone-pin{position:absolute;z-index:5;transform:translate(-50%,-50%);border:2px solid #aac7b5;border-radius:12px;background:#fff9e9;color:#4f7063;box-shadow:2px 3px 0 #557b6b38;padding:7px 9px;min-width:80px;font-size:10px;font-weight:900;display:grid;justify-items:center;gap:2px;transition:transform .2s,filter .2s}.zone-pin:active{transform:translate(-50%,-50%) scale(.94)}.zone-pin.active{outline:3px solid #fff2bc;box-shadow:0 0 0 5px #fff2bc55,2px 3px 0 #557b6b38}.zone-pin.locked{filter:grayscale(.7);opacity:.7}.zone-pin small{font-size:9px;color:#84958a;font-weight:700}.zone-pin .symbol{font-size:19px}.pin-beach{left:28%;top:65%}.pin-garden{left:53%;top:30%}.pin-cozy{left:72%;top:61%}.pin-lagoon{left:85%;top:25%}.pin-heights{left:17%;top:18%}.map-animal.cat-mark{position:absolute;width:72px;height:72px}.map-animal.cat-mark svg{width:100%;height:100%}.map-animal{position:absolute;z-index:6;width:72px;height:72px;object-fit:contain;filter:drop-shadow(2px 3px 0 #526d5a35);animation:bob 3s ease-in-out infinite;pointer-events:none;transition:left .35s,top .35s}.map-palm{position:absolute;z-index:3;left:42%;top:43%;width:10px;height:49px;border-radius:9px;background:#a87958;transform:rotate(7deg)}.map-palm:before{content:"";position:absolute;left:-22px;top:-13px;width:55px;height:29px;background:#6eaa7d;clip-path:polygon(50% 70%,0 0,43% 37%,20% 0,55% 35%,100% 8%,68% 55%)}.placed{position:absolute;z-index:7;font-size:22px;filter:drop-shadow(1px 2px 0 #526d5a40);animation:pop .35s both}.scene{position:relative;min-height:225px;overflow:hidden;border-radius:16px;margin-top:12px;background:linear-gradient(#c6e9e4 0 55%,#8cc7bd 55%);border:1px solid #c4ded1}.scene:before{content:"";position:absolute;inset:auto -8% -45px;height:130px;background:var(--zone-ground,#efd7a6);border-radius:50% 50% 0 0}.scene .scene-sun{position:absolute;right:13%;top:18px;width:34px;height:34px;border-radius:50%;background:#fff0bb;box-shadow:0 0 0 8px #fff0bb35}.scene .scene-title{position:absolute;z-index:2;left:14px;top:12px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:900;color:#58796e}.scene .landmark{position:absolute;z-index:2;bottom:45px;left:50%;transform:translateX(-50%);font-size:72px;filter:drop-shadow(2px 4px 0 #5a7c6425)}.scene .cat-mark{position:absolute;z-index:3;bottom:16px;left:18%;width:88px;height:88px}.cat-mark svg{width:100%;height:100%}.scene .companion{position:absolute;z-index:3;bottom:16px;left:18%;width:88px;height:88px;object-fit:contain;animation:bob 3s ease-in-out infinite}.scene .scene-extra{position:absolute;z-index:2;right:15%;bottom:35px;font-size:30px;animation:float 4s ease-in-out infinite}.scene.garden{background:linear-gradient(#d6eddf 0 52%,#a9d4a0 52%)}.scene.garden:before{--zone-ground:#b2d59b}.scene.cozy{background:linear-gradient(#e9e2d5 0 52%,#c3d8b6 52%)}.scene.cozy:before{--zone-ground:#c4d6ae}.scene.lagoon{background:linear-gradient(#aee1e5 0 52%,#5eafb4 52%)}.scene.lagoon:before{--zone-ground:#e5d7aa}.scene.heights{background:linear-gradient(#d9e6f2 0 52%,#b9c9df 52%)}.scene.heights:before{--zone-ground:#c7c9db}.zone-info{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:14px;background:#f6f5e9;border:1px solid #e2e7d9}.zone-icon{font-size:31px}.zone-info h3{margin:0 0 4px}.zone-info p{margin:0}.btn{border:1px solid #cbded1;border-radius:12px;background:#f5f0df;color:#526f60;padding:9px 12px;font-size:11px;font-weight:900}.btn.primary{background:#557d6d;color:white;border-color:#557d6d}.btn:disabled{opacity:.45;cursor:not-allowed}.companion-row{display:flex;align-items:center;gap:13px}.companion-row img,.companion-row .cat-mark{width:104px;height:100px;object-fit:contain;flex:none}.cat-mark svg{width:100%;height:100%}.select{width:100%;border:1px solid #d4e2d6;border-radius:11px;padding:11px;background:#fffdf5;color:var(--ink);margin-top:7px}.decor-grid,.reward-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.decor-item{display:flex;gap:9px;align-items:center;text-align:left;padding:10px;border:1px solid #dce8dc;border-radius:13px;background:#fffdf7;color:var(--ink)}.decor-item .art{font-size:23px}.decor-item b{display:block;font-size:11px}.decor-item small{display:block;color:var(--muted);font-size:9px}.decor-item.locked{opacity:.45}.decor-item.placed{background:#edf6e9;border-color:#9fc5a9}.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#f5f5e9;padding:12px;border-radius:13px}.stat b{font-size:24px;display:block}.stat span{font-size:10px;color:var(--muted)}.session-box{background:linear-gradient(145deg,#f5eee0,#e5f1e9);border:1px solid #d8e5d9;border-radius:18px;padding:18px;text-align:center}.clock{font-size:clamp(32px,8vw,48px);font-weight:900;font-variant-numeric:tabular-nums;margin:9px}.counter{display:flex;align-items:center;justify-content:center;gap:20px;margin:17px}.counter strong{font-size:48px}.round{width:46px;height:46px;border-radius:50%;border:1px solid #c8d9cd;background:white;color:#527a68;font-size:24px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}.reward{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #dce8dc;border-radius:13px;background:#fffdf7}.reward.locked{opacity:.42;filter:grayscale(1)}.toy{width:50px;height:50px;border-radius:13px;background:#f1e8dc;display:grid;place-items:center;font-size:27px}.reward b{display:block;font-size:12px}.reward small{font-size:10px;color:var(--muted)}.memory{border-left:3px solid #a8c9b5;padding:4px 0 4px 12px;margin:12px 0}.memory b{font-size:13px}.memory p{font-size:12px;color:var(--muted);margin:4px 0}.empty{text-align:center;padding:24px;color:var(--muted);font-size:13px}.toast{position:fixed;z-index:20;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#405f53;color:white;padding:11px 16px;border-radius:99px;font-size:12px;box-shadow:0 5px 20px #0002;max-width:90vw;text-align:center;animation:pop .25s both}@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}@keyframes float{0%,100%{translate:0 0}50%{translate:0 -8px}}@keyframes pop{from{opacity:0;scale:.92}to{opacity:1;scale:1}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.leaf{transform-origin:bottom;animation:sway 4s ease-in-out infinite}.footer{text-align:center;color:#81958a;font-size:10px;padding:18px 0 0}.hidden{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr}.hero-island{width:47%;opacity:.88}.hero{min-height:225px}.map{height:320px}}@media(max-width:430px){.app{padding:12px 10px 26px}.hero{padding:18px;min-height:218px}.hero-island{right:-5%;width:52%;transform:scale(.84);transform-origin:bottom right}.hero p{max-width:230px}.zone-pin{min-width:65px;padding:5px 6px;font-size:9px}.zone-pin small{font-size:8px}.map-animal{width:60px;height:60px}.map-animal.cat-mark{width:60px;height:60px}.map{height:285px}.decor-grid,.reward-grid{grid-template-columns:1fr}.zone-info{align-items:flex-start;flex-wrap:wrap}}
</style></head><body><main class="app"><div class="topline"><div class="brand">A tiny cozy knitting game</div><div class="save-note" id="saveNote">Sauvegarde locale activée</div></div><header class="hero"><div class="sun"></div><div class="cloud"></div><div class="hero-copy"><div class="eyebrow">a little world between rows</div><h1>WIP Island</h1><p>Un petit refuge pour tes projets, tes compagnons et tous les rangs que tu as envie de tricoter.</p><div class="stats"><span class="pill" id="pillRows">0 rang</span><span class="pill" id="pillSessions">0 session</span><span class="pill" id="pillTrophies">0 trophée</span></div></div><div class="hero-island"><div class="hero-sand"></div><div class="hero-tree leaf"></div><div class="hero-house"></div></div></header>
<nav class="tabs" aria-label="Navigation"><button class="active" data-tab="explore">Explorer</button><button data-tab="session">Session</button><button data-tab="collection">Collection</button><button data-tab="memories">Souvenirs</button></nav><section id="view"></section><div class="footer">Made of little stitches, soft days & tiny adventures · WIP Island</div></main>
<script>
(()=>{
'use strict';
const KEY='dreamos.wipIsland.game.v1';
const animals=[['turtle','Tortue','wip_island_tortue_verte.png','La sage gardienne des souvenirs.'],['sheep','Mouton','wip_island_mouton.png','Le compagnon des journées toutes douces.'],['narwhal','Narval','wip_island_narval.png','Le curieux qui adore les trésors marins.'],['octopus','Poulpe','wip_island_poulpe.png','Le petit artiste de l’île.'],['cat','Chat','','Le visiteur indépendant et mystérieux.'],['dog','Chien','wip_island_chien.png','Le plus affectueux des compagnons.'],['rabbit','Lapin','wip_island_lapin.png','Le jardinier timide de l’île.'],['eagle','Aigle','wip_island_aigle.png','L’observateur qui repère les secrets.']];
const zones=[['beach','Sunny Beach',0,'Le sable chaud, les coquillages et le bruit des vagues.','◒','◒','♧','Une petite plage paisible où tout a commencé.'],['garden','Little Garden',50,'Un jardin secret rempli de fleurs, de papillons et de petites pousses.','✿','✿','❀','Les fleurs poussent doucement au fil de tes rangs.'],['cozy','Cozy Corner',150,'Un refuge avec une maisonnette, une couverture et une lumière toute douce.','⌂','⌂','♣','Le coin parfait pour lire, se reposer et rêver.'],['lagoon','Blue Lagoon',350,'Une eau turquoise, des poissons curieux et des trésors sous-marins.','≈','≋','◉','Un lagon magique qui scintille au soleil.'],['heights','Dreamy Heights',700,'Un petit sommet dans les nuages, avec des étoiles et des arcs-en-ciel.','✧','☁','✧','Un endroit suspendu entre ciel et mer.']];
const decor=[['shell','Coquillage nacré','◉',10,'Un petit trésor sur le sable.'],['flower','Fleur soleil','✿',50,'Une fleur pour le jardin.'],['lamp','Lanterne cosy','▣',150,'Une lumière douce au crépuscule.'],['boat','Petit voilier','⌁',350,'Pour explorer les eaux turquoise.'],['star','Étoile filante','✧',700,'Un porte-bonheur venu des hauteurs.']];
const trophies=[['shell','Little Shell',10,'◉'],['berry','Berry Buddy',25,'♥'],['mushroom','Tiny Mushroom',50,'♧'],['whale','Sleepy Whale',100,'≈'],['flower','Sunny Flower',200,'✿'],['bear','Pocket Bear',350,'●'],['jelly','Jelly Friend',550,'◌'],['yarn','Yarn Sprite',800,'⌁']];
const defaults={companion:'turtle',section:'explore',selectedZone:'beach',placedDecor:[],totalRows:0,totalSessions:0,sessions:[],trophies:[],memories:[],active:null};
let state;try{state=Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){state={...defaults};}
let ticker=null;
if(state.section==='island')state.section='explore';if(state.section==='trophies')state.section='collection';if(!['explore','session','collection','memories'].includes(state.section))state.section='explore';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const animal=()=>animals.find(a=>a[0]===state.companion)||animals[0];const zone=()=>zones.find(z=>z[0]===state.selectedZone)||zones[0];const unlocked=z=>state.totalRows>=z[2];
function img(a,cls=''){if(a[2])return `<img class="${cls}" src="wip_island_assets/${a[2]}" alt="${esc(a[1])}">`;return `<div class="${cls} cat-mark" aria-label="Chat"><svg viewBox="0 0 100 100" role="img"><path d="M19 44 16 13 40 29Q50 25 60 29L84 13 81 44Q91 55 85 72Q78 91 50 91Q22 91 15 72Q9 55 19 44Z" fill="#f1e6d8" stroke="#9c8879" stroke-width="3"/><path d="M29 55h3m36 0h3" stroke="#625850" stroke-width="4" stroke-linecap="round"/><path d="M47 65q3 4 6 0" fill="none" stroke="#a77c78" stroke-width="3" stroke-linecap="round"/></svg></div>`;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('#saveNote').textContent='Progression sauvegardée';}catch(e){$('#saveNote').textContent='Sauvegarde indisponible';}}
function toast(t){let n=$('.toast');if(n)n.remove();n=document.createElement('div');n.className='toast';n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),2600);}
function updateStats(){ $('#pillRows').textContent=state.totalRows+' rang'+(state.totalRows>1?'s':'');$('#pillSessions').textContent=state.totalSessions+' session'+(state.totalSessions>1?'s':'');$('#pillTrophies').textContent=state.trophies.length+' trophée'+(state.trophies.length>1?'s':''); }
function unlock(){let fresh=[];trophies.forEach(t=>{if(state.totalRows>=t[2]&&!state.trophies.includes(t[0])){state.trophies.push(t[0]);fresh.push(t);}});fresh.forEach(t=>state.memories.unshift({date:Date.now(),title:'Un petit cadeau !',text:`Tu as découvert ${t[1]} après ${t[2]} rangs cumulés.`}));if(fresh.length)toast('Un nouveau petit trophée t’attend !');save();}
function render(){updateStats();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.section));let v=$('#view');if(state.section==='explore')v.innerHTML=explore();else if(state.section==='session')v.innerHTML=session();else if(state.section==='collection')v.innerHTML=collection();else v.innerHTML=memories();}
function explore(){let z=zone(),a=animal(),pos={beach:[34,76],garden:[56,46],cozy:[74,76],lagoon:[84,39],heights:[19,35]}[z[0]];let pins=zones.map(q=>`<button class="zone-pin pin-${q[0]} ${state.selectedZone===q[0]?'active':''} ${unlocked(q)?'':'locked'}" data-zone="${q[0]}" ${unlocked(q)?'':'disabled'}><span class="symbol">${q[4]}</span>${q[1]}<small>${unlocked(q)?'Explorer':q[2]+' rangs'}</small></button>`).join('');let placed=decor.filter(d=>state.placedDecor.includes(d[0])).map((d,i)=>`<span class="placed" style="left:${[18,65,78,38,88][i]}%;top:${[55,20,70,80,40][i]}%">${d[2]}</span>`).join('');
return `<div class="layout"><div class="stack"><article class="card"><div class="row"><div class="grow"><h2>Explore ton archipel</h2><div class="muted">Choisis une escale pour découvrir son petit univers.</div></div><span class="pill">${zones.filter(unlocked).length}/5 zones</span></div><div class="map"><div class="map-label">WIP ISLAND · THE ARCHIPELAGO</div><div class="map-palm"></div>${pins}${placed}${img(a,'map-animal').replace('class="map-animal"',`class="map-animal" style="left:${pos[0]}%;top:${pos[1]}%"`)}</div><div class="zone-info"><div class="zone-icon">${z[4]}</div><div class="grow"><h3>${z[1]}</h3><p class="muted">${z[3]}</p></div><button class="btn" data-pet>Un câlin</button></div></article><article class="card"><div class="row"><div class="grow"><h2>${z[1]} · un petit aperçu</h2><div class="muted">Chaque escale a son ambiance et ses animations.</div></div></div><div class="scene ${z[0]}"><div class="scene-sun"></div><div class="scene-title">${z[1]}</div><div class="landmark">${z[5]}</div><div class="scene-extra">${z[6]}</div>${img(a,'companion')}</div><p class="muted" style="margin:10px 2px 0">${z[7]}</p></article></div><aside class="stack"><article class="card"><div class="companion-row">${img(a)}<div><div class="eyebrow">Ton compagnon</div><h2>${a[1]}</h2><p class="muted">${a[3]}</p></div></div><label class="muted" for="companion">Choisir ton compagnon</label><select class="select" id="companion">${animals.map(x=>`<option value="${x[0]}" ${x[0]===state.companion?'selected':''}>${x[1]}</option>`).join('')}</select></article><article class="card"><h2>Décorer l'île</h2><p class="muted">Débloque des petits objets avec tes rangs, puis installe-les sur la carte.</p><div class="decor-grid">${decor.map(d=>{let open=state.totalRows>=d[3],put=state.placedDecor.includes(d[0]);return `<button class="decor-item ${open?'':'locked'} ${put?'placed':''}" data-decor="${d[0]}" ${open?'':'disabled'}><span class="art">${d[2]}</span><span><b>${d[1]}</b><small>${put?'Installé · toucher pour retirer':open?'Disponible':`À ${d[3]} rangs`}</small></span></button>`}).join('')}</div></article><article class="card stats-grid"><div class="stat"><b>${state.totalRows}</b><span>Rangs cumulés</span></div><div class="stat"><b>${state.totalSessions}</b><span>Sessions terminées</span></div><div class="stat"><b>${state.trophies.length}/8</b><span>Amigurumis découverts</span></div><div class="stat"><b>${zones.filter(unlocked).length}/5</b><span>Zones ouvertes</span></div></article></aside></div>`;}
function elapsed(){if(!state.active)return 0;return (state.active.elapsed||0)+(state.active.running?Math.max(0,Date.now()-state.active.started):0)}function fmt(ms){let s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return [h,m,r].map(n=>String(n).padStart(2,'0')).join(':')}
function session(){let a=state.active;return `<div class="layout"><div class="stack"><article class="session-box"><div class="eyebrow">Your cozy knitting session</div><div class="clock" id="clock">${fmt(elapsed())}</div><p class="muted">${a?(a.running?'Ta session est en cours. Prends ton temps.':'Session en pause.'):'Une petite session à ton rythme, sans pression.'}</p><div class="actions">${!a?'<button class="btn primary" data-start>Commencer une session</button>':(a.running?'<button class="btn" data-pause>Pause</button>':'<button class="btn primary" data-resume>Reprendre</button>')+(a?'<button class="btn" data-finish>Terminer</button>':'')}</div></article>${a?`<article class="card"><div class="eyebrow" style="text-align:center">Rangs réalisés</div><div class="counter"><button class="round" data-rows="-1">−</button><strong id="rowCount">${a.rows}</strong><button class="round" data-rows="1">+</button></div><div class="actions"><button class="btn" data-rows="5">+5 rangs</button><button class="btn" data-rows="10">+10 rangs</button></div><p class="muted" style="text-align:center">Tu peux ajuster ton total à tout moment.</p></article>`:'<article class="card"><h2>Un petit rappel</h2><p class="muted">Installe-toi confortablement, garde tes mains détendues et fais une pause quand tu en as besoin.</p></article>'}</div><aside class="stack"><article class="card"><h2>Ton compagnon t'attend</h2><div class="companion-row">${img(animal())}<div><b>${animal()[1]}</b><p class="muted">Il garde ta place au soleil pendant que tu tricotes.</p></div></div></article><article class="card"><h2>Petits paliers à venir</h2><p class="muted">${trophies.filter(t=>!state.trophies.includes(t[0])).slice(0,3).map(t=>`${t[1]} · ${t[2]} rangs`).join('<br>')||'Toute la collection est découverte !'}</p></article></aside></div>`;}
function collection(){return `<div class="stack"><article class="card"><div class="row"><div class="grow"><h2>La petite collection</h2><p class="muted">Des souvenirs à garder, gagnés tranquillement au fil des rangs.</p></div><span class="pill">${state.trophies.length}/8</span></div><div class="reward-grid">${trophies.map(t=>{let got=state.trophies.includes(t[0]);return `<div class="reward ${got?'':'locked'}"><div class="toy">${got?t[3]:'？'}</div><div><b>${got?t[1]:'Mystery buddy'}</b><small>${got?'Découvert':`À ${t[2]} rangs`}</small></div></div>`}).join('')}</div></article><article class="card"><h2>Les cinq escales</h2><div class="decor-grid">${zones.map(z=>`<div class="reward ${unlocked(z)?'':'locked'}"><div class="toy">${z[4]}</div><div><b>${z[1]}</b><small>${unlocked(z)?'Accessible':`À ${z[2]} rangs cumulés`}</small></div></div>`).join('')}</div></article></div>`;}
function memories(){return `<article class="card"><h2>Tes petits souvenirs</h2><p class="muted">Les instants précieux que ton île garde pour toi.</p>${state.memories.length?state.memories.map(m=>`<div class="memory"><b>${esc(m.title)}</b><p>${esc(m.text)}</p><small class="muted">${new Date(m.date).toLocaleDateString('fr-BE',{day:'numeric',month:'long',year:'numeric'})}</small></div>`).join(''):'<div class="empty">Tes premiers souvenirs apparaîtront après ta première session et tes premières découvertes.</div>'}</article>`;}
function start(){state.active={started:Date.now(),elapsed:0,running:true,rows:0};save();render();ticker=setInterval(()=>{let c=$('#clock');if(c&&state.active?.running)c.textContent=fmt(elapsed());},1000)}function pause(){if(!state.active)return;state.active.elapsed=elapsed();state.active.running=false;save();clearInterval(ticker);render()}function resume(){state.active.started=Date.now();state.active.running=true;save();render();ticker=setInterval(()=>{let c=$('#clock');if(c&&state.active?.running)c.textContent=fmt(elapsed());},1000)}function addRows(n){if(!state.active)return;let next=Math.max(0,state.active.rows+n),d=next-state.active.rows;state.active.rows=next;state.totalRows=Math.max(0,state.totalRows+d);unlock();save();let r=$('#rowCount');if(r)r.textContent=next;updateStats();}
function finish(){if(!state.active)return;let ms=elapsed(),rows=state.active.rows;clearInterval(ticker);state.totalSessions++;state.sessions.unshift({date:Date.now(),rows,ms});state.memories.unshift({date:Date.now(),title:'Une session toute douce',text:`Tu as tricoté ${rows} rang${rows>1?'s':''} en ${fmt(ms)}. Chaque rang compte.`});state.active=null;save();render();toast('Session enregistrée. Bravo pour tes rangs !');}
$('#view').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.zone){state.selectedZone=b.dataset.zone;save();render()}else if(b.dataset.decor){let id=b.dataset.decor;if(state.placedDecor.includes(id))state.placedDecor=state.placedDecor.filter(x=>x!==id);else state.placedDecor.push(id);save();render()}else if(b.hasAttribute('data-pet'))toast('Un gros câlin tout doux pour '+animal()[1]+' !');else if(b.hasAttribute('data-start'))start();else if(b.hasAttribute('data-pause'))pause();else if(b.hasAttribute('data-resume'))resume();else if(b.hasAttribute('data-finish'))finish();else if(b.dataset.rows)addRows(Number(b.dataset.rows));});
$('#view').addEventListener('change',e=>{if(e.target.id==='companion'){state.companion=e.target.value;save();render()}});document.querySelector('.tabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(!b)return;state.section=b.dataset.tab;save();render()});
if(state.active?.running){state.active.running=false;state.active.elapsed=elapsed();save()}render();
})();
</script></body></html>
